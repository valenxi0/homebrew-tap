# Keeps Casks/nano.rb on the latest Nano release.
name: Update Nano

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [nano-release]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point the cask at the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/valenxi0/Nano/releases/latest --jq .tag_name)
          version=${tag#v}
          current=$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/nano.rb)
          if [ "$version" = "$current" ]; then
            echo "Already on $version"
            exit 0
          fi
          curl -fsSL -o Nano.dmg "https://github.com/valenxi0/Nano/releases/download/${tag}/Nano-${version}.dmg"
          sha=$(sha256sum Nano.dmg | cut -d' ' -f1)
          sed -i "s/^  version \".*\"/  version \"${version}\"/; s/^  sha256 \".*\"/  sha256 \"${sha}\"/" Casks/nano.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Nano ${version}"
          git push
